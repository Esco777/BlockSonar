[package]
name = "blocksonar-membership"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "blocksonar_membership"
[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", features = ["metadata"] }
pyth-solana-receiver-sdk = "=1.2.0"

# Pyth 1.2 uses Anchor/Borsh 0.10; keep the compatible message serialization.
pythnet-sdk = "=2.3.1"
